        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            git \
            python3-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libsqlite3-dev \
            sqlite3 \
            bzip2 \
            libbz2-dev \
            libssl-dev \
            openssl \
            libgdbm-dev \
            liblzma-dev \
            libffi-dev \
            uuid-dev \
            libreadline-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libdb5.3-dev \
            libexpat1-dev \
            pkg-config \
            libicu-dev \
            autoconf \
