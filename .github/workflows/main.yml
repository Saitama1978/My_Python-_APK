name: Build Firewall APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer dependencies
        run: |
          sudo apt update
          # Pag-install ng lahat ng kailangang system libraries para sa Android build
          sudo apt install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            cmake \
            gettext \
            libltdl-dev \
            libgmp-dev \
            libmpc-dev \
            libmpfr-dev

          # Pag-install ng Buildozer at Cython
          pip install --user --upgrade buildozer cython virtualenv

      - name: Build APK with Buildozer
        run: |
          # Idagdag ang local bin sa PATH para matawag ang buildozer command
          export PATH=$PATH:$HOME/.local/bin
          
          # Auto-accept ng Android SDK licenses bago ang mismong build
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | buildozer android debug || true
          
          # Simulan ang pag-build ng debug APK
          buildozer android debug
        env:
          # Safety environment variable para sa SDK licenses
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Firewall-APK-RenanteFullo
          path: bin/*.apk
