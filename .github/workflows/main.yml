- name: Install Buildozer dependencies
        run: |
          sudo apt update
          # Inalis natin ang libtinfo5 at pinalitan ng libtinfo6/dev tools
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev cmake
          pip install --user --upgrade buildozer cython virtualenv
