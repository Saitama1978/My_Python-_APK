name: Build Firewall APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04 # Mas stable na version para sa Buildozer

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Updated version

      - name: Set up Python
        uses: actions/setup-python@v5 # Updated version
        with:
          python-version: '3.10'

      - name: Install Buildozer dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev cmake gettext libltdl-dev libgmp-dev libmpc-dev libmpfr-dev
          pip install --user --upgrade buildozer cython virtualenv

      - name: Build APK with Buildozer
        run: |
          export PATH=$PATH:$HOME/.local/bin
          # Auto-accept ng licenses
          yes | buildozer android debug || true
          buildozer android debug
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
          # Pinipilit natin ang Node version para sa compatibility
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true" 

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Firewall-APK-Final
          path: bin/*.apk
