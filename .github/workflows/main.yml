name: Build Firewall APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    # Binago natin ito sa 22.04 para iwas sa error sa Ubuntu 24
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            cmake \
            gettext \
            libltdl-dev \
            libgmp-dev \
            libmpc-dev \
            libmpfr-dev
          
          pip install --user --upgrade buildozer cython virtualenv

      - name: Build APK with Buildozer
        run: |
          export PATH=$PATH:$HOME/.local/bin
          # Mas siguradong pag-accept ng licenses
          yes | buildozer android debug || true
          # Dagdagan natin ng log level para makita natin ang detalye kung sasabit man
          buildozer android debug
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
