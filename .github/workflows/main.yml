name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04 # Mas stable na version para sa Buildozer

    steps:
      - uses: actions/checkout@v4

      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1.6.1 # Gumamit tayo ng specific version
        with:
          buildozer_version: stable
          command: buildozer android debug
          # Inalis natin ang python_version dito dahil nagbibigay ito ng warning kanina

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: python-apk-output
          path: bin/*.apk
