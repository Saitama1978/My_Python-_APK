name: Build APK Ultimate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            git \
            python3-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libgstreamer1.0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libsqlite3-dev \
            sqlite3 \
            bzip2 \
            libbz2-dev \
            libssl-dev \
            openssl \
            libgdbm-dev \
            liblzma-dev \
            libffi-dev \
            uuid-dev \
            libreadline-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libdb5.3-dev \
            libexpat1-dev \
            pkg-config \
            libicu-dev \
            autoconf \
            automake \
            libtool \
            cmake \
            ant

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install --upgrade "Cython<3.0"
          pip install buildozer
          # Siguraduhin na ang Buildozer ay nasa PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build APK with Buildozer
        run: |
          # Tinatanggal ang luma para iwas error sa Gradle
          rm -rf .buildozer
          # Ang -v ay para makita natin ang eksaktong error kung sakaling pumalya ulit
          buildozer -v android debug
        env:
          # Force Node 24 support para sa mga bagong runners
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-Python-App
          path: bin/*.apk